name: iOS build & test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generér Xcode-projekt
        run: xcodegen generate

      - name: Byg og test på iOS-simulator
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))
          ')
          echo "Bruger simulator $UDID"
          xcodebuild test \
            -project CarXplore.xcodeproj \
            -scheme CarXplore \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
